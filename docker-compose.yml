version: "3.9"

services:
  app:
    image: research-vault:latest
    build:
      context: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    # environment:
    #   HTTP_PROXY: http://host.docker.internal:7890
    #   HTTPS_PROXY: http://host.docker.internal:7890
    #   ALL_PROXY: http://host.docker.internal:7890
    #   NO_PROXY: localhost,127.0.0.1,db,redis,searxng
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"  # Required for Linux
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      searxng:
        condition: service_started
    volumes:
      - .:/app
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vault}
      POSTGRES_DB: ${POSTGRES_DB:-researchvault}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5430:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-vault} -d ${POSTGRES_DB:-researchvault}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6378:6379"
    restart: unless-stopped

  searxng:
    image: searxng/searxng
    ports:
      - "8080:8080"
    # environment:
    #   SEARXNG_SECRET: ${SEARXNG_SECRET}
    #   HTTP_PROXY: http://host.docker.internal:7890
    #   HTTPS_PROXY: http://host.docker.internal:7890
    #   ALL_PROXY: http://host.docker.internal:7890
    #   NO_PROXY: localhost,127.0.0.1,db,redis,searxng
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"  # Required for Linux
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped

  celery_worker:
    image: research-vault:latest
    command: celery -A app.tasks.celery_app worker --loglevel=info
    env_file:
      - .env
    # environment:
    #   HTTP_PROXY: http://host.docker.internal:7890
    #   HTTPS_PROXY: http://host.docker.internal:7890
    #   ALL_PROXY: http://host.docker.internal:7890
    #   NO_PROXY: localhost,127.0.0.1,db,redis,searxng
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"  # Required for Linux
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  searxng_data: