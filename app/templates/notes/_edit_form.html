<form
  class="note-item"
  id="note-{{ note.id }}"
  hx-put="/projects/{{ project.id }}/notes/{{ note.id }}"
  hx-target="closest .note-item"
  hx-swap="outerHTML"
  aria-label="Edit note"
>
  <label for="edit-title-{{ note.id }}"
    >Title
    <input
      type="text"
      id="edit-title-{{ note.id }}"
      name="title"
      value="{{ note.title }}"
      required
    />
  </label>
  <label for="edit-content-{{ note.id }}"
    >Content
    <textarea id="edit-content-{{ note.id }}" name="content" rows="3">
{{ note.content }}</textarea
    >
  </label>
  <label for="edit-source-{{ note.id }}"
    >Source link (optional)
    <select id="edit-source-{{ note.id }}" name="source_link_id">
      <option value="">No source link</option>
      {% for link in links %}
      <option
        value="{{ link.id }}"
        {% if note.source_link_id and note.source_link_id== "link.id" %} selected {% endif %}
      >
        {{ link.title }}
      </option>
      {% endfor %}
    </select>
  </label>
  <div class="grid">
    <button type="submit">Save</button>
    <button
      type="button"
      class="secondary outline"
      hx-get="/projects/{{ project.id }}/notes/list"
      hx-target="#notes-container"
      hx-swap="innerHTML"
    >
      Cancel
    </button>
  </div>
</form>
