<div id="project-list" class="project-grid">
  {% for project in projects %}
  <article aria-label="Project: {{ project.name }}">
    <header><strong>{{ project.name }}</strong></header>
    <p>{{ project.description or "No description yet." }}</p>
    <footer>
      <small>Created {{ project.created_at.strftime("%b %d, %Y") }}</small>
      <div style="margin-top: 0.5rem">
        <a href="/projects/{{ project.id }}" role="button" class="outline"
          >Open project</a
        >
      </div>
    </footer>
  </article>
  {% else %}
  <p>
    You don't have any projects yet. Create your first one above to get started.
  </p>
  {% endfor %}
</div>
